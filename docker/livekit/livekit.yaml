port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  # Local dev: clients and SFU run on same host/docker network.
  # Advertising public WAN IP in this mode causes intermittent ICE failures.
  use_external_ip: false
turn:
  enabled: true
  udp_port: 5349
keys:
  voxter_dev_key: voxter_dev_secret_please_change_123456
room:
  empty_timeout: 600
  max_participants: 100
logging:
  level: info
