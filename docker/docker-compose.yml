services:
  db:
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxter}
      POSTGRES_DB: ${POSTGRES_DB:-voxter}
    ports:
      - "5432:5432"
    volumes:
      - voxter_db:/var/lib/postgresql

  redis:
    image: redis:8.4.1-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voxter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voxtersecret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - voxter_minio:/data

  livekit:
    image: livekit/livekit-server:v1.9.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "5349:5349/udp"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
      - livekit
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-voxter}:${POSTGRES_PASSWORD:-voxter}@db:5432/${POSTGRES_DB:-voxter}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 7
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOADS_DIR: uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-voxter}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-voxtersecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-voxter}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      LIVEKIT_REST_URL: ${LIVEKIT_REST_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-voxter_dev_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-voxter_dev_secret_please_change_123456}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-voxter}
    ports:
      - "4000:4000"
    volumes:
      - voxter_uploads:/app/uploads
    command:
      [
        "sh",
        "-lc",
        "for i in $(seq 1 30); do npx prisma migrate deploy && break; echo 'Waiting for database...'; sleep 2; done; npx prisma migrate deploy && node dist/main.js"
      ]

volumes:
  voxter_db:
  voxter_minio:
  voxter_uploads:
